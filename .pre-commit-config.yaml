repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
        exclude: ^assets/samples/.*\.(wav|mp4)$
      - id: check-merge-conflict
      - id: check-toml
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint (locked uv environment)
        entry: uv run --locked --no-sync ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format (locked uv environment)
        entry: uv run --locked --no-sync ruff format --check
        language: system
        types_or: [python, pyi]
