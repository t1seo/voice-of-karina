[project]
name = "voice-of-karina"
version = "0.2.0"
description = "Conversational, local-first voice creation for Codex and Claude"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.11,<3",
  "numpy>=2,<3",
  "scipy>=1.15,<2",
  "soundfile>=0.13,<1",
  "typer>=0.16,<1",
  "rich>=14,<15",
  "yt-dlp>=2026.3.17",
  "webrtcvad-wheels==2.0.14",
  "tomlkit>=0.13,<1",
]

[project.optional-dependencies]
local = ["mlx-audio==0.5.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "basedpyright>=1.31,<2"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_of_karina"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
pythonPlatform = "All"
include = ["src/voice_of_karina", "tests"]
exclude = ["**/__pycache__", "**/.venv", "build", "dist"]
reportUnusedCallResult = "warning"
# Exhaustive match ends in assert_never even when the current union is fully covered.
reportUnnecessaryComparison = false
stubPath = "src/voice_of_karina/backends/_stubs"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ISC001", "D203", "D213", "CPY001", "FBT001", "FBT002", "EM101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "PLR2004", "SLF001", "D", "INP001"]
"src/voice_of_karina/backends/interfaces.py" = ["D102", "PLR0913"]
"src/voice_of_karina/backends/native.py" = ["PLC0415"]
"src/voice_of_karina/backends/runtime.py" = ["PLC0415"]
"src/voice_of_karina/storage.py" = ["PLC0415"]
"src/voice_of_karina/notification_storage.py" = ["PLC0415"]
"src/voice_of_karina/__main__.py" = ["TC003"]
"tests/test_backends_generation.py" = ["PLR0913"]
"tests/test_backends_worker.py" = ["PLR0913"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
